services:
  # ====================================================
  # 11111 - Frontend Dashboard (Nginx UI)
  # ====================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sysmon-frontend
    ports:
      - "${FRONTEND_PORT:-11111}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sysmon-net

  # ====================================================
  # 22222 - Backend Telemetry API & Collector (Node.js)
  # ====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sysmon-backend
    environment:
      PORT: 22222
      HOST: 0.0.0.0
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:33333/sysmon}
      MONGO_DB: ${MONGO_DB:-sysmon}
      VPS_SSH_HOST: ${VPS_SSH_HOST:-192.168.101.116}
      VPS_SSH_PORT: ${VPS_SSH_PORT:-22}
      VPS_SSH_USER: ${VPS_SSH_USER:-mapims}
      VPS_SSH_PASSWORD: ${VPS_SSH_PASSWORD:-inhouse@67}
    ports:
      - "${BACKEND_PORT:-22222}:22222"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/hostname:/etc/host_hostname:ro
      - /proc:/host/proc:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:22222/api/summary || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - sysmon-net

  # ====================================================
  # 33333 - MongoDB Database (Telemetry & Alerts)
  # ====================================================
  mongodb:
    image: mongo:7
    container_name: sysmon-mongodb
    command: ["--port", "33333"]
    ports:
      - "${MONGO_PORT:-33333}:33333"
    volumes:
      - sysmon-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 33333 --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - sysmon-net

  # ====================================================
  # 55555 - VPS Telemetry & Docker Agent (Node.js)
  # ====================================================
  vps-agent:
    build:
      context: ./vps-agent
      dockerfile: Dockerfile
    container_name: sysmon-vps-agent
    ports:
      - "${VPS_AGENT_PORT:-55555}:55555"
    environment:
      PORT: 55555
      HOST: 0.0.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/hostname:/etc/host_hostname:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    networks:
      - sysmon-net

volumes:
  sysmon-mongo-data:
    name: sysmon-mongo-data

networks:
  sysmon-net:
    name: sysmon-network

