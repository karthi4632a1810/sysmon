<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseBoard — Infrastructure &amp; Container Monitor</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2.2'><path d='M3 12h4l2.5-7 5 14 2.5-7h4'/></svg>">
</head>
<body>
  <div class="bg">
    <i class="a1"></i>
    <i class="a2"></i>
    <i class="a3"></i>
    <div class="grid"></div>
  </div>

  <div id="bootEl">
    <div class="bootOrb"><span></span></div>
    <div class="bootName">PulseBoard</div>
    <div class="bootBar"><i></i></div>
  </div>

  <header class="topbar">
    <div class="logo" onclick="location.hash=''; location.reload();">
      <div class="logoDot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div class="logoTxt">
        <span>PulseBoard</span>
        <small>System &amp; Docker Monitor</small>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="nodeSwitcher">
      <div class="switchPills">
        <button id="pillVps" class="switchPill" title="Switch to Remote VPS (192.168.101.116)">
          <span class="dot ok"></span>
          <span>☁️ VPS 192.168.101.116</span>
        </button>
        <button id="pillLocal" class="switchPill" title="Switch to Local Machine">
          <span class="dot ok"></span>
          <span>💻 Local</span>
        </button>
      </div>
      <div class="hostPicker">
        <span class="hpLabel">Node</span>
        <select id="hostSel" title="Select Monitored Server Node"></select>
        <span id="connBadge"></span>
      </div>
    </div>
    <button id="quickRefreshBtn" class="btn sm" title="Refresh Telemetry Now" style="padding: 6px 12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Poll</span>
    </button>
    <div class="livePill">
      <span class="dot ok"></span>
      <span id="liveClock" class="mono">--:--:--</span>
    </div>
  </header>

  <div class="shell">
    <aside class="side">
      <div class="sideEyebrow">PulseBoard v2.0 PRO</div>
      <nav id="sideNav"></nav>
      <div class="foot">
        <div class="feedRow"><span class="dot ok"></span> <b>LIVE TELEMETRY</b></div>
        <span>Real-time Docker socket &amp; host metric streams</span>
      </div>
    </aside>
    <main class="main">
      <div id="viewCtn"></div>
    </main>
  </div>

  <div id="toastWrap" class="toastWrap"></div>

  <script src="src/app.js"></script>
</body>
</html>
